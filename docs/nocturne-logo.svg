<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" role="img" aria-label="Nocturne">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- crescent mark -->
  <g transform="translate(40,50)">
    <rect x="0" y="0" width="120" height="120" rx="34" fill="url(#g)"/>
    <circle cx="86" cy="42" r="48" fill="#0c0c13"/>
  </g>
  <!-- wordmark -->
  <text x="200" y="150" font-family="'Inter Variable','Inter',system-ui,Arial,sans-serif"
        font-size="120" font-weight="700" letter-spacing="6" fill="url(#g)">NOCTURNE</text>
</svg>
