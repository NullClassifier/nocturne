# Dev infrastructure only. The API and worker run locally via `uv run` for hot
# reload. Buckets are created by `noct seed` (in code), not here.
services:
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nocturne
      POSTGRES_PASSWORD: nocturne
      POSTGRES_DB: nocturne
    ports: ['5432:5432']
    volumes: ['nocturne_pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nocturne']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: ['nocturne_minio:/data']
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  nocturne_pg: {}
  nocturne_minio: {}
