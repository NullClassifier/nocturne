# Dev infrastructure only. The API and worker run locally via `uv run` for hot
# reload. Buckets are created by `noct seed` (in code), not here.
services:
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nocturne
      POSTGRES_PASSWORD: nocturne
      POSTGRES_DB: nocturne
    ports: ['5432:5432']
    volumes: ['nocturne_pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nocturne']
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-compatible object storage (reports, loot, uploads). SeaweedFS is used
  # instead of MinIO because MinIO's images now require registry auth. It serves
  # the S3 API on :9000 with the minioadmin/minioadmin credentials the app
  # expects (see .env.example), so nothing else changes.
  s3:
    image: chrislusf/seaweedfs:3.80
    command: server -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -dir=/data -ip.bind=0.0.0.0
    ports: ['9000:9000']
    volumes:
      - 'nocturne_s3:/data'
      - './docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro'

volumes:
  nocturne_pg: {}
  nocturne_s3: {}
